modLoader="javafml"
loaderVersion="[47,)"
license="${license}"

[[mods]]
modId="${modId}"
version="${version}"
displayName="${modName}"
authors="${authors}"
description='''${modDescription}'''
displayTest="IGNORE_SERVER_VERSION"

[[mixins]]
config="${modId}.mixins.json"

[[dependencies.${modId}]]
modId="forge"
mandatory=true
versionRange="[${forge},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${modId}]]
modId="minecraft"
mandatory=true
versionRange="[${mc}]"
ordering="NONE"
side="CLIENT"
