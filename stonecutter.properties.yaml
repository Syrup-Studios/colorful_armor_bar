mod:
  id: colorful_armor_bar
  name: Colorful Armor Bar
  group: net.syrupstudios
  version: 1.0.2
  description: A mod to add colors to the armor bar using texture packs!.
  authors: SodaSyrup
  license: RSL-1.0
  homepage: https://wiki.thesalad.bar/mods/colorful_armor_bar/
  issues: https://github.com/Syrup-Studios/colorful_armor_bar/issues
